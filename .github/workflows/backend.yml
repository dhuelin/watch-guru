name: Backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'

# A second push to the same branch makes the first run irrelevant.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

# Read-only by default. A job that needs more asks for it by name, so a
# compromised step can do no more than that job was trusted with.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The JUnit report is published as a check run.
      checks: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Java 25 is the current LTS and is what pom.xml targets. Declaring it
      # here rather than relying on the runner's default is the point: the
      # project previously targeted Java 26, which meant it silently failed to
      # compile anywhere that shipped an older JDK.
      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Testcontainers needs a working Docker daemon. ubuntu-latest provides
      # one; this step fails loudly and early if that ever stops being true,
      # rather than surfacing as a confusing container-startup error mid-suite.
      - name: Verify Docker is available
        run: docker info > /dev/null

      # OpenApiSpecTest runs as part of this suite and fails the build if the
      # committed openapi.json no longer matches the controllers. Both mobile
      # clients are generated from that file, so drift means the apps are built
      # against an API that no longer exists.
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: backend/target/surefire-reports/TEST-*.xml
          check_name: Backend test results

      - name: Upload surefire reports on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 7

