name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-android
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

jobs:
  bundle:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      # Holds the signing material. Keeping it on an environment rather than in
      # repository secrets means a release build can require an approval, and
      # a pull request from a fork can never reach the keystore.
      name: android-release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      # The keystore is stored base64-encoded because secrets are text. It is
      # written outside the workspace so it cannot be picked up by a build step
      # or an artifact upload.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on the android-release environment."
            echo "Generate one with: keytool -genkeypair -v -keystore release.jks \\"
            echo "  -keyalg RSA -keysize 4096 -validity 10000 -alias watchguru"
            echo "then: base64 -w0 release.jks"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build App Bundle
        env:
          WATCHGURU_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WATCHGURU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WATCHGURU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WATCHGURU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: watch-guru-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Deliberately stops here rather than uploading to Play. That step needs
      # a service account, a listing, and a signed developer agreement -- none
      # of which exist yet, and a half-configured publish step that fails on
      # every release is worse than an explicit gap.
      - name: Next step
        run: |
          echo "::notice::Bundle built and uploaded as an artifact."
          echo "Publishing to Play needs a service-account JSON and a created listing;"
          echo "add r0adkll/upload-google-play here once those exist."
