name: Release Android

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-android
  cancel-in-progress: false

defaults:
  run:
    working-directory: android

# Read-only by default. A job that needs more asks for it by name, so a
# compromised step can do no more than that job was trusted with.
permissions:
  contents: read

jobs:
  bundle:
    name: Build signed App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      # Holds the signing material. Keeping it on an environment rather than in
      # repository secrets means a release build can require an approval, and
      # a pull request from a fork can never reach the keystore.
      name: android-release

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # The keystore is stored base64-encoded because secrets are text. It is
      # written outside the workspace so it cannot be picked up by a build step
      # or an artifact upload.
      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on the android-release environment."
            echo "Generate one with: keytool -genkeypair -v -keystore release.jks \\"
            echo "  -keyalg RSA -keysize 4096 -validity 10000 -alias watchguru"
            echo "then: base64 -w0 release.jks"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # Both of these are compiled into the binary, and both are wrong by
      # default: the API URL is a placeholder domain that resolves to nothing,
      # and an empty client id turns every sign-in into a configuration error.
      # A bundle shipped with either would install and then do nothing, so the
      # build stops here rather than at a one-star review.
      - name: Check the build is pointed at something real
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          fail=0
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Set the ANDROID_API_BASE_URL variable on the android-release environment"
            echo "to the deployed backend, e.g. https://api.example.com/ (with the trailing slash)."
            fail=1
          fi
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Set the GOOGLE_WEB_CLIENT_ID secret on the android-release environment."
            echo "It is the Google *web* client id, and the backend's WATCH_GURU_AUTH_AUDIENCES"
            echo "must list the same value."
            fail=1
          fi
          exit $fail

      - name: Build App Bundle
        env:
          WATCHGURU_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          WATCHGURU_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WATCHGURU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WATCHGURU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        # versionCode comes from the run number because Play refuses an upload
        # whose versionCode it has seen before, and run numbers only ever go
        # up. versionName comes from the tag on a published release, and falls
        # back to the Gradle default on a manual dispatch -- which is why it
        # goes through the environment: an absent tag then expands to nothing
        # at all, rather than to an empty -P flag Gradle reads as a blank name.
        run: |
          ./gradlew :app:bundleRelease \
            -Pwatchguru.apiBaseUrl="${{ vars.ANDROID_API_BASE_URL }}" \
            -Pwatchguru.googleWebClientId="${{ secrets.GOOGLE_WEB_CLIENT_ID }}" \
            -Pwatchguru.versionCode="${{ github.run_number }}" \
            ${VERSION_NAME:+-Pwatchguru.versionName="$VERSION_NAME"}

      - name: Upload the bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: watch-guru-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # Publishing is opt-in on the presence of the service account, because
      # a secret cannot be read in an `if:` directly. Without it this job still
      # does its real work -- a signed bundle you can upload by hand -- rather
      # than failing on every release until Play is set up.
      - name: Is Play publishing configured?
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, so the bundle is an artifact only."
            echo "Upload it by hand, or see docs/STORE-LISTING.md to finish the setup."
          fi

      # The very first bundle for a package has to go through the console by
      # hand: the API can upload to a track, but it cannot bring an app into
      # existence. Every upload after that one can come from here.
      - name: Upload to Play
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.huelin.watchguru
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          # Internal testing by default: it reaches testers in minutes and
          # needs no review, which is the right place for a build nobody has
          # run yet. Override with the PLAY_TRACK variable once that changes.
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: completed
