name: Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android

# Read-only by default. A job that needs more asks for it by name, so a
# compromised step can do no more than that job was trusted with.
permissions:
  contents: read

jobs:
  build:
    name: Assemble and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # AGP requires 17; the app targets it too.
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Seconds, and before the eight-minute build: a duplicate resource name
      # or a comment containing "--" fails the merge rather than the compile,
      # so the error arrives late and looks unrelated to the change that caused
      # it. Both have now cost a CI round.
      - name: Check resources
        working-directory: .
        run: python3 tools/check-android-resources.py

      # Kotlin imports one function at a time, not one package: importing
      # UiState does not bring in contentOrNull, even though they share a file.
      # Nothing says so but a full Gradle build, and the one that did say so
      # cost a round.
      - name: Check imports
        working-directory: .
        run: python3 tools/check-kotlin-imports.py

      # A missing translation is invisible: Android falls back to the base
      # language and says nothing, so half a German build looks like a German
      # build with some English in it.
      - name: Check translations
        working-directory: .
        run: python3 tools/check-translations.py

      # And a string that never became a resource is invisible to the check
      # above, because there is nothing for it to compare: it is simply
      # English, in every language, for ever. Twelve had already slipped
      # through when this was added.
      - name: Check Compose strings
        working-directory: .
        run: python3 tools/check-compose-strings.py

      # This is the first Gradle build these sources will ever have had. They
      # were written in an environment that could not reach Google's Maven, so
      # the plugin versions and everything under ui/ are unproven. The data
      # layer beneath them was compiled and tested separately.
      - name: Assemble debug
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test report on failure
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: android-test-report
          path: android/app/build/reports/tests/
          retention-days: 7
