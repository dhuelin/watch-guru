name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  # A published release produces the versioned image; pushes to main produce
  # the rolling one. Using the release event rather than a tag filter avoids
  # the paths filter above silently skipping a tag whose commit happened not to
  # touch backend/.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Never cancel a deploy in progress: a half-finished rollout is worse than a
  # queued one.
  group: deploy-backend
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

# Read-only by default. A job that needs more asks for it by name, so a
# compromised step can do no more than that job was trusted with.
permissions:
  contents: read

jobs:
  # The image is only built once the tests that matter have passed. Building
  # first and testing after would mean publishing an image nobody has verified.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Verify
        run: ./mvnw -B --no-transfer-progress verify

  publish:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Passed to the deploy so it rolls out this exact image rather than
      # resolving a tag again and possibly getting a different one.
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      # For build provenance, so a published image can be traced to the commit
      # and workflow that produced it.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          # No 'latest' on every main push: it makes "which image is running"
          # unanswerable after the fact. Tag a release to move latest.
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy
    needs: publish
    runs-on: ubuntu-latest
    # A GitHub environment, so the deploy can require an approval and hold the
    # runtime secrets rather than the repository holding them.
    environment:
      name: production
      url: https://watch-guru-api.fly.dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Opt-in on the token being present, because a secret cannot be read in
      # an `if:` directly. Until Fly is set up this job says what is missing
      # and succeeds, rather than turning every push to main red.
      - name: Is Fly configured?
        id: fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_API_TOKEN is not set on the production environment."
            echo "The image is published and ready; see docs/DEPLOYMENT.md for the"
            echo "one-time Fly setup, which ends with: flyctl tokens create deploy"
          fi

      - name: Install flyctl
        if: steps.fly.outputs.configured == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6

      # By digest, not by tag: a tag can be moved, and "which image is
      # running" has to stay answerable after the fact. This is the digest of
      # the image the tests in this same run passed against.
      #
      # Fly pulls this itself, so the GHCR package has to be readable without
      # credentials. Packages are private even when their repository is
      # public, and this one has to be switched over once by hand -- see
      # docs/DEPLOYMENT.md. The symptom otherwise is flyctl failing on an
      # unauthorized pull, which reads like a Fly problem and is not one.
      - name: Roll out
        if: steps.fly.outputs.configured == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
        run: |
          echo "Deploying $IMAGE"
          flyctl deploy \
            --config backend/fly.toml \
            --image "$IMAGE" \
            --strategy rolling \
            --wait-timeout 10m
