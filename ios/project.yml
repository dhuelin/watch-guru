# XcodeGen project definition.
#
# The Xcode project is generated rather than committed. A .pbxproj is a large
# machine-managed file that merges badly and cannot be reviewed; this is the
# same information in a form a human can read in a pull request.
#
#   brew install xcodegen
#   cd ios && xcodegen generate && open WatchGuru.xcodeproj
#
name: WatchGuru
options:
  bundleIdPrefix: dev.dhuelin
  deploymentTarget:
    # iOS 17 is the floor: @Observable and ContentUnavailableView are used
    # throughout, and back-porting them would mean writing the app twice.
    #
    # Not the Tab builder, despite what this comment used to claim -- that is
    # iOS 18, and the compiler said so. The tab bar uses .tabItem.
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  WatchGuruAPI:
    path: WatchGuruAPI

targets:
  WatchGuru:
    type: application
    platform: iOS
    sources:
      - path: WatchGuru/Sources
      # No longer optional: the asset catalogue in here carries the app icon,
      # and a build without one is rejected by App Store Connect rather than
      # merely looking unfinished on the home screen.
      - path: WatchGuru/Resources
    dependencies:
      - package: WatchGuruAPI
      # Embeds the extension in the app bundle. Without this the widget builds
      # and is then nowhere to be found on the device, which looks like a
      # WidgetKit problem and is not.
      - target: WatchGuruWidgets
    entitlements:
      path: WatchGuru/WatchGuru.entitlements
    # An explicit Info.plist rather than INFOPLIST_KEY_* build settings.
    #
    # Two reasons, both found by the first build that got this far. Without
    # either this block or GENERATE_INFOPLIST_FILE, no plist is produced at all
    # and packaging fails with "Build input file cannot be found:
    # WatchGuru.app/Info.plist". And INFOPLIST_KEY_NSAppTransportSecurity does
    # not exist -- that mechanism covers a fixed set of scalar keys, and ATS is
    # a dictionary -- so the App Transport Security exception this project
    # believed it had was never actually applied.
    info:
      path: WatchGuru/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Scoped to loopback and nothing else, so the simulator can reach a
        # backend running on the developer's machine. It ships in release too,
        # which the previous comment claimed it would not -- but an exception
        # for "localhost" permits no cleartext over the network at all, only to
        # the device itself. Splitting it per configuration would mean two
        # plists to keep in step for no security gain.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhuelin.watchguru
        # Named rather than implied: Xcode only looks for an "AppIcon" set by
        # default, and a renamed set fails silently with no icon at all.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Complete checking, not minimal: the app is written for it, and
        # relaxing it later is far easier than adopting it later.
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  # The home-screen widget (#20).
  #
  # Deliberately does NOT depend on WatchGuruAPI. A widget extension has a hard
  # memory budget -- it is killed rather than warned -- and the whole generated
  # client would be linked to read six fields. Instead it compiles the handful
  # of app files it genuinely needs, listed one by one below so that list is a
  # decision rather than an accident:
  #
  #   Shared/            the App Group, the feed shape, the base URL
  #   Data/TokenStore    the session, read from the shared Keychain group
  #   Data/Offline/*     the queue a mark falls back to when the session is old
  #
  # Anything else the widget appears to need is a sign it is doing too much.
  WatchGuruWidgets:
    type: app-extension
    platform: iOS
    sources:
      # Includes Resources/en.lproj: its own catalogue, not the app's, because
      # a literal is looked up in the bundle it was compiled into and an
      # extension is a separate bundle.
      - path: WatchGuruWidgets
      - path: WatchGuru/Sources/Shared
      - path: WatchGuru/Sources/Data/TokenStore.swift
      - path: WatchGuru/Sources/Data/Offline/OfflineStore.swift
      - path: WatchGuru/Sources/Data/Offline/MutationQueue.swift
      - path: WatchGuru/Sources/Data/Offline/PendingMutation.swift
    entitlements:
      path: WatchGuruWidgets/WatchGuruWidgets.entitlements
    info:
      path: WatchGuruWidgets/Info.plist
      properties:
        CFBundleDisplayName: Watch Guru
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dhuelin.watchguru.widgets
        # Must match the app's, or the extension is rejected at install time
        # for having a version its container does not.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # An extension has no main() of its own to run.
        SKIP_INSTALL: YES

  WatchGuruTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WatchGuru/Tests
    dependencies:
      - target: WatchGuru
    settings:
      base:
        SWIFT_VERSION: "6.0"
        # The test bundle needs an Info.plist too, and needs no custom keys in
        # it, so let Xcode synthesise one. The app target cannot do the same:
        # it needs an ATS dictionary, which the generated-plist build settings
        # cannot express.
        GENERATE_INFOPLIST_FILE: YES

schemes:
  WatchGuru:
    build:
      targets:
        WatchGuru: all
        WatchGuruWidgets: all
        WatchGuruTests: [test]
    test:
      targets:
        - WatchGuruTests
