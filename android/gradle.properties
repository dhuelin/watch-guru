org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Sign in with Google. This is the OAuth *web* client id from the Google Cloud
# console, not the Android one: Credential Manager mints an ID token whose
# audience is the web client, and the backend's WATCH_GURU_AUTH_AUDIENCES must
# list that same value.
#
# Not a secret -- an OAuth client id is public, and the Android client is bound
# to the app's signing certificate -- but it is per-project, so it is left unset
# here and supplied locally or by CI:
#
#   ./gradlew :app:assembleDebug -Pwatchguru.googleWebClientId=<id>.apps.googleusercontent.com
#
# Unset, the app builds and shows the sign-in screen, and tapping it reports a
# configuration error rather than failing silently.
# watchguru.googleWebClientId=
